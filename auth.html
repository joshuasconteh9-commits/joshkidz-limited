<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | JoshKidz Limited</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .auth-page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--cream)}
    .auth-art{background:var(--ink);color:var(--cream);padding:52px 9vw;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
    .auth-art:after{content:'J';position:absolute;font:700 48vw/.7 var(--serif);color:var(--coral);opacity:.9;right:-8vw;bottom:-5vw;font-style:italic}
    .auth-art .brand{position:relative;z-index:1}.auth-art .brand-mark{background:var(--yellow);color:var(--ink)}.auth-message{position:relative;z-index:1;max-width:430px;padding-bottom:8vh}.auth-message h1{font:600 clamp(45px,5vw,75px)/.98 var(--serif);letter-spacing:-3px;margin:0 0 22px}.auth-message h1 em{color:var(--yellow);font-style:normal}.auth-message p{max-width:340px;color:#b9c8b8;font-size:16px}.auth-form-wrap{display:flex;align-items:center;justify-content:center;padding:55px 7vw}.auth-form{width:min(390px,100%)}.auth-form .brand{display:none}.auth-form h2{font:600 37px var(--serif);letter-spacing:-1.5px;margin:0 0 8px}.auth-subtitle{font-size:14px;color:#557069;margin:0 0 35px}.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:28px;gap:25px}.auth-tab{background:none;border:0;padding:0 0 12px;color:#78908a;font:600 12px var(--sans);cursor:pointer;border-bottom:2px solid transparent}.auth-tab.active{color:var(--ink);border-color:var(--coral)}.form-field{display:block;font-size:11px;font-weight:700;margin-bottom:18px;color:#45635c}.form-field input{display:block;width:100%;font:400 15px var(--sans);margin-top:7px;border:1px solid var(--line);padding:14px;background:transparent;color:var(--ink);outline:none}.form-field input:focus{border-color:var(--coral)}.form-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin:2px 0 25px}.form-row label{display:flex;align-items:center;gap:7px;color:#557069}.form-row a{color:var(--coral);font-weight:700}.auth-submit{width:100%;border:0;cursor:pointer;justify-content:center;margin-top:2px}.auth-note{font-size:11px;color:#557069;text-align:center;margin:24px 0}.auth-note a{color:var(--coral);font-weight:700}.form-status{font-size:12px;color:var(--ink);background:var(--green);padding:11px 13px;margin-bottom:18px;display:none}.back-home{font-size:12px;font-weight:700;display:inline-block;margin-top:25px;border-bottom:1px solid var(--ink);padding-bottom:4px}@media(max-width:760px){.auth-page{display:block}.auth-art{min-height:290px;padding:30px 8vw}.auth-art:after{font-size:65vw;right:-10vw}.auth-message{padding-bottom:0}.auth-message h1{font-size:45px}.auth-message p{font-size:14px}.auth-form-wrap{padding:55px 8vw}.auth-form .brand{display:flex;margin-bottom:45px}}
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-art"><a class="brand" href="index.html"><span class="brand-mark">J</span><span>Josh<span>Kidz</span><small>LIMITED</small></span></a><div class="auth-message"><h1>There’s room<br>for <em>you.</em></h1><p>Join a growing community making brighter futures possible for children across Sierra Leone.</p></div></section>
    <section class="auth-form-wrap"><div class="auth-form"><a class="brand" href="index.html"><span class="brand-mark">J</span><span>Josh<span>Kidz</span><small>LIMITED</small></span></a><h2 id="form-title">Welcome back</h2><p class="auth-subtitle" id="form-subtitle">Sign in to stay connected with JoshKidz.</p><div class="auth-tabs"><button class="auth-tab active" data-mode="signin">Sign in</button><button class="auth-tab" data-mode="signup">Create an account</button></div><div class="form-status" role="status"></div><form id="auth-form"><label class="form-field signup-only" hidden>Full name<input type="text" name="name" autocomplete="name"></label><label class="form-field">Email address<input type="email" name="email" required autocomplete="email"></label><label class="form-field">Password<input type="password" name="password" required minlength="6" autocomplete="current-password"></label><label class="form-field signup-only" hidden>Confirm password<input type="password" name="confirm" minlength="6" autocomplete="new-password"></label><div class="form-row"><label><input type="checkbox" name="remember"> Remember me</label><a href="mailto:joshuasconteh9@gmail.com">Forgot password?</a></div><button class="button button-primary auth-submit" type="submit"><span id="submit-label">Sign in</span> ↗</button></form><p class="auth-note" id="auth-note">New to JoshKidz? <a href="#" data-switch="signup">Create an account</a></p><a class="back-home" href="index.html">← Back to JoshKidz</a></div></section>
  </main>
  <script src="auth.js"></script>
</body>
</html>
